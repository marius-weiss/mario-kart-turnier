<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mario Kart Turnier</title>
<style>
:root{
  --sky1:#47B8F5; --sky2:#BFE9FF; --panel:#FFFFFF; --panel2:#F1F6FC; --ink:#1B1D29; --muted:#4F5870;
  --edge:#1B1D29; --red:#E8352E; --yellow:#FFC72C; --green:#2FA84F; --blue:#1E7FD8; --white:#FFFFFF;
  --road:#3A3F52; --wire-line:#FFFFFF; --gold:#FFC72C; --silver:#C3CBD8; --bronze:#D58A4C;
  --display:"Arial Black","Arial Bold",Impact,"Helvetica Neue",sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky1:#0E1430; --sky2:#232B57; --panel:#1E2546; --panel2:#283160; --ink:#F2F4FA; --muted:#B4BCD6;
  --edge:#05070F; --road:#151A33; --blue:#4DA3F0; --green:#46C46A; color-scheme:dark;}}
:root[data-theme="dark"]{--sky1:#0E1430; --sky2:#232B57; --panel:#1E2546; --panel2:#283160; --ink:#F2F4FA; --muted:#B4BCD6;
  --edge:#05070F; --road:#151A33; --blue:#4DA3F0; --green:#46C46A; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%;background:var(--sky2)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 var(--body);
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 520px,var(--sky2) 100%)}
.curb{height:14px;background:repeating-linear-gradient(90deg,var(--red) 0 30px,var(--white) 30px 60px);border-bottom:3px solid var(--edge)}
.checker{height:18px;background:conic-gradient(var(--edge) 25%,var(--white) 0 50%,var(--edge) 0 75%,var(--white) 0) 0 0/18px 18px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.logo{font-family:var(--display);font-weight:900;font-style:italic;letter-spacing:.01em;line-height:.95;margin:0;
  color:var(--white);-webkit-text-stroke:2px var(--edge);paint-order:stroke fill;
  text-shadow:4px 4px 0 var(--red),7px 7px 0 var(--edge);transform:skewX(-6deg);display:inline-block}
.top{padding:26px 0 6px}
.top .logo{font-size:clamp(34px,6.5vw,64px)}
.sub{margin:12px 0 0;color:var(--ink);font-weight:600}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px}
nav button,.pill{font:700 15px var(--body);border:3px solid var(--edge);background:var(--panel);color:var(--ink);
  padding:8px 16px;border-radius:999px;cursor:pointer;box-shadow:3px 3px 0 var(--edge)}
nav button[aria-selected="true"]{background:var(--yellow);color:#1B1D29}
nav .spacer{flex:1}
nav .show{background:var(--red);color:#fff}
main{padding:18px 0 70px}
section{display:none} section.on{display:block}
h2{font-family:var(--display);font-style:italic;font-weight:900;font-size:24px;margin:4px 0 14px;transform:skewX(-6deg)}
h3{font-size:17px;margin:0 0 8px}
.panel{background:var(--panel);border:3px solid var(--edge);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:5px 5px 0 var(--edge)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:3px solid var(--edge);border-radius:10px;padding:8px 12px}
input[type=text]{flex:1;min-width:180px}
textarea{width:100%;min-height:76px;resize:vertical}
input[type=number]{width:86px;font-weight:700;text-align:right}
.btn{font:700 15px var(--body);border:3px solid var(--edge);border-radius:12px;padding:9px 16px;cursor:pointer;
  background:var(--blue);color:#fff;box-shadow:3px 3px 0 var(--edge)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.btn.go{background:var(--green)}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn.danger{background:var(--panel);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
details summary{cursor:pointer;font-weight:700;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:2px solid var(--edge);border-radius:999px;padding:4px 6px 4px 14px;font-weight:600}
.chip button{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:999px}
.chip button:disabled{visibility:hidden}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:14px;margin:12px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.stats div{background:var(--panel2);border:2px solid var(--edge);border-radius:12px;padding:12px 14px}
.stats b{display:block;font:italic 900 26px var(--display)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.group{background:var(--panel);border:3px solid var(--edge);border-radius:16px;overflow:hidden;box-shadow:4px 4px 0 var(--edge)}
.group .gh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;color:#fff;border-bottom:3px solid var(--edge)}
.group.c1 .gh{background:var(--blue)} .group.c2 .gh{background:var(--red)}
.group .gh h3{margin:0;font:italic 900 19px var(--display)}
.group .gh span{font-size:13px;font-weight:700}
.group .gb{padding:6px 14px 10px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:2px dashed var(--panel2)}
.prow:first-child{border-top:0}
.roundbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill[aria-pressed="true"]{background:var(--blue);color:#fff}
.pill.done::after{content:" ✓"}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0 6px;width:100%;min-width:440px}
th{font-size:13px;color:var(--muted);text-align:left;padding:0 12px;font-weight:700}
td{background:var(--panel2);padding:10px 12px;font-weight:600}
td:first-child{border-radius:12px 0 0 12px} td:last-child{border-radius:0 12px 12px 0}
.num{text-align:right;font-variant-numeric:tabular-nums}
td.total{font:italic 900 20px var(--display)}
tr.qual td{background:color-mix(in srgb,var(--green) 22%,var(--panel2))}
.badge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:3px solid var(--edge);
  font:italic 900 16px var(--display);background:var(--panel);color:var(--ink)}
.b1{background:var(--gold);color:#1B1D29} .b2{background:var(--silver);color:#1B1D29} .b3{background:var(--bronze);color:#1B1D29}
.tie{font-size:12px;color:var(--red);margin-left:8px;font-weight:700}
/* Turnierbaum */
.tree{position:relative;display:flex;gap:64px;align-items:stretch;padding:10px 6px 10px;min-width:max-content}
.tree svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:0}
.tcol{display:flex;flex-direction:column;justify-content:space-around;gap:22px;min-width:220px;position:relative;z-index:1;padding-top:30px}
.tcol>.lbl{position:absolute;top:0;left:0;right:0;font:italic 900 14px var(--display);color:var(--muted);margin:0;text-align:center}
.node{background:var(--panel);border:3px solid var(--edge);border-radius:16px;box-shadow:4px 4px 0 var(--edge);overflow:hidden}
.node .nh{padding:8px 14px;font:italic 900 16px var(--display);border-bottom:3px solid var(--edge);background:var(--panel2)}
.node.final .nh{background:var(--yellow);color:#1B1D29}
.node.final::before{content:"";display:block;height:12px;border-bottom:3px solid var(--edge);background:conic-gradient(var(--edge) 25%,var(--white) 0 50%,var(--edge) 0 75%,var(--white) 0) 0 0/12px 12px}
.node.win{text-align:center;padding:16px 18px;background:var(--panel)}
.node.win .cup{font-size:46px;line-height:1}
.node.win .wn{font:italic 900 22px var(--display);margin-top:6px}
.node .nb{padding:8px 14px 10px}
.node .prow select{padding:4px 8px}
.slot{color:var(--muted);font-style:italic;margin:2px 0}
.trow{display:flex;align-items:center;gap:10px;padding:5px 0}
.trow .badge{width:28px;height:28px;font-size:13px;border-width:2px}
.funwrap{margin-top:22px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-top:8px}
.podium div{text-align:center;border:3px solid var(--edge);border-bottom:0;border-radius:14px 14px 0 0;padding:12px 10px;min-width:110px;color:#1B1D29;font-weight:800}
.podium .p1{background:var(--gold);min-height:150px} .podium .p2{background:var(--silver);min-height:115px} .podium .p3{background:var(--bronze);min-height:88px}
.podium span{display:block;font:italic 900 32px var(--display)}
.empty{text-align:center;padding:30px}
/* Anzeige-Modus */
body.display .edit-only{display:none!important}
body.display{font-size:20px}
body.display .wrap{max-width:none;padding:0 40px}
.dview{display:none} .dview.on{display:block}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0 10px}
.dhead .logo{font-size:clamp(36px,4.5vw,72px)}
.lights{display:flex;gap:10px;background:var(--edge);padding:8px 12px;border-radius:999px}
.lights i{width:20px;height:20px;border-radius:50%;background:#3a3f52;display:block}
.lights i.on{background:var(--green);box-shadow:0 0 12px var(--green)}
.dtitle{font:italic 900 clamp(26px,3vw,44px) var(--display);margin:6px 0 16px;transform:skewX(-6deg)}
body.display .group .gh h3{font-size:26px} body.display .group .gh span{font-size:17px}
body.display .groups{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
body.display td{font-size:22px;padding:12px 16px} body.display td.total{font-size:28px}
body.display .badge{width:44px;height:44px;font-size:20px}
body.display .tcol{min-width:280px} body.display .node .nh{font-size:20px}
body.display .trow{font-size:22px}
body.display .tcol{flex:1} body.display .tcol>.lbl{font-size:18px} body.display .tree{min-width:0;width:100%}
body.display .podpanel h2{display:none}
body.display .podium{gap:18px;padding-top:30px}
body.display .podium div{min-width:240px;font-size:30px}
body.display .podium span{font-size:56px}
body.display .podium .p1{min-height:320px} body.display .podium .p2{min-height:250px} body.display .podium .p3{min-height:200px}
.progress{height:6px;background:var(--panel2);border:2px solid var(--edge);border-radius:999px;overflow:hidden;margin-top:18px}
.progress i{display:block;height:100%;width:0;background:var(--red)}
@media (prefers-reduced-motion:no-preference){.progress i.run{animation:prog linear forwards}@keyframes prog{to{width:100%}}}
@media (prefers-reduced-motion:no-preference){.wires .rbline{animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}}
@media (max-width:640px){.tree{gap:40px}.tcol{min-width:190px}}
.brand{display:flex;align-items:center;gap:18px}
.brand img{height:clamp(54px,7vw,90px);width:auto;max-width:200px;object-fit:contain;border:3px solid var(--edge);border-radius:14px;background:var(--panel);box-shadow:4px 4px 0 var(--edge)}
body.display .brand img{height:clamp(70px,7vw,120px)}
.badge.b1{background:linear-gradient(160deg,#FFF3B0 0,#FFC72C 45%,#E09A00 100%)}
.badge.b2{background:linear-gradient(160deg,#FFFFFF 0,#C3CBD8 50%,#8E99AB 100%)}
.badge.b3{background:linear-gradient(160deg,#F7C9A2 0,#D58A4C 50%,#9C5A26 100%)}
.counter{font:italic 900 22px var(--display);background:var(--yellow);color:#1B1D29;border:3px solid var(--edge);border-radius:999px;padding:4px 16px;box-shadow:3px 3px 0 var(--edge)}
.dright{display:flex;align-items:center;gap:14px}
.soundbtn{font:700 14px var(--body);border:3px solid var(--edge);border-radius:999px;background:var(--panel);color:var(--ink);padding:6px 12px;cursor:pointer}
/* Effekte */
#fx{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(10,12,28,.97)}
#fx.on{display:grid}
.fxbox{text-align:center;color:#fff}
.biglights{display:flex;gap:22px;justify-content:center;background:#111;border:5px solid #000;border-radius:28px;padding:22px 30px;box-shadow:0 0 0 5px #fff3}
.biglights i{width:clamp(56px,9vw,110px);height:clamp(56px,9vw,110px);border-radius:50%;background:#33384a;display:block;border:4px solid #000}
.biglights i.red{background:radial-gradient(circle at 35% 30%,#ff9a8f,#E8352E 55%,#8a1510);box-shadow:0 0 30px #E8352E}
.biglights i.green{background:radial-gradient(circle at 35% 30%,#b6ffc6,#2FA84F 55%,#14592a);box-shadow:0 0 40px #2FA84F}
.fxtext{font:italic 900 clamp(40px,8vw,120px) var(--display);margin-top:24px;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:6px 6px 0 var(--red);transform:skewX(-8deg)}
.fxsub{font:700 clamp(18px,2.4vw,32px) var(--body);margin-top:10px;min-height:1.4em;opacity:.9}
#confetti{position:fixed;inset:0;z-index:60;pointer-events:none;display:none}
.flags{position:fixed;inset:auto 0 0 0;z-index:55;display:none;justify-content:space-between;pointer-events:none;padding:0 4vw}
.flags.on{display:flex}
.flag{width:clamp(80px,12vw,180px);height:clamp(56px,8vw,120px);border:4px solid #000;background:conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0) 0 0/25% 33.4%;transform-origin:left bottom}
@media (prefers-reduced-motion:no-preference){.flags.on .flag{animation:wave .5s ease-in-out infinite alternate}.flags.on .flag:last-child{animation-delay:.25s}@keyframes wave{from{transform:rotate(-8deg) skewY(-4deg)}to{transform:rotate(6deg) skewY(5deg)}}}

/* Glücksrad */
#wheelfx{position:fixed;inset:0;z-index:52;display:none;place-items:center;background:rgba(10,12,28,.97);color:#fff;text-align:center;padding:20px;cursor:pointer}
#wheelfx.on{display:grid}
.wfor{font:700 clamp(16px,2vw,24px) var(--body);opacity:.85;min-height:1.4em}
.wname{font:italic 900 clamp(30px,5vw,64px) var(--display);-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:4px 4px 0 var(--red);transform:skewX(-6deg);margin:4px 0 16px}
.wheelbox{position:relative;width:min(56vmin,440px);aspect-ratio:1;margin:0 auto}
.wheel{width:100%;height:100%;transition-property:transform;transition-timing-function:cubic-bezier(.215,.61,.355,1)}
.wheel svg{width:100%;height:100%;display:block}
.wpointer{position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:42px solid var(--yellow);filter:drop-shadow(0 3px 0 #000);z-index:2}
.wresult{font:italic 900 clamp(22px,3.4vw,46px) var(--display);margin-top:20px;min-height:1.3em;transform:skewX(-6deg)}
.wskip{font-size:14px;opacity:.6;margin-top:18px}
.wsum{max-width:760px;margin:0 auto;text-align:left;color:var(--ink)}
.htag{display:block;width:fit-content;font-size:12px;font-weight:700;background:var(--yellow);color:#1B1D29;border:2px solid var(--edge);border-radius:8px;padding:2px 8px;margin-top:4px;line-height:1.3}
body.display .htag{font-size:16px}
.hlist{display:grid;gap:12px}
.hcard{display:flex;gap:14px;align-items:center;background:var(--panel2);border:3px solid var(--edge);border-radius:14px;padding:12px 16px;font-weight:600}
.hcard .em{font-size:34px;line-height:1}
.hcard b{display:block;font:italic 900 19px var(--display)}
body.display .hcard{font-size:24px} body.display .hcard b{font-size:30px} body.display .hcard .em{font-size:52px}
/* Kopfgeld & Stechen */
.btag{display:inline-block;margin-left:8px;font-size:12px;font-weight:800;background:var(--gold);color:#1B1D29;border:2px solid var(--edge);border-radius:8px;padding:1px 7px;line-height:1.3;vertical-align:middle;white-space:nowrap}
body.display .btag{font-size:16px}
.bonus{font-size:.8em;font-weight:800;color:var(--green);margin-left:4px;white-space:nowrap}
.bnote{background:color-mix(in srgb,var(--gold) 30%,var(--panel2));border:2px solid var(--edge);border-radius:12px;padding:8px 14px;font-weight:600;margin:0 0 14px}
.tbbtn{font:700 12px var(--body);margin-left:8px;border:2px solid var(--edge);border-radius:8px;background:var(--panel);color:var(--ink);padding:2px 8px;cursor:pointer;vertical-align:middle}
.tie.won{color:var(--green)}
/* Ruhmeshalle */
.rgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px;align-items:start}
@media (max-width:900px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.rpod{margin-top:4px;font-weight:600}
.rwarn{background:color-mix(in srgb,var(--red) 14%,var(--panel2));border:2px solid var(--edge);border-radius:12px;padding:8px 14px;font-weight:600;margin:10px 0 0}
input[type=date]{font:inherit;color:var(--ink);background:var(--panel2);border:3px solid var(--edge);border-radius:10px;padding:8px 12px}
.tbbtn.del{color:var(--red)}
</style>
</head>
<body>
<div class="curb" aria-hidden="true"></div>
<div class="wrap">
  <header class="top edit-only">
    <div class="brand" id="brandEdit"><h1 class="logo">Mario Kart Turnier</h1></div>
    <p class="sub" id="sub"></p>
    <nav role="tablist" aria-label="Bereiche">
      <button role="tab" data-tab="teilnehmer">Teilnehmer</button>
      <button role="tab" data-tab="liga">Liga</button>
      <button role="tab" data-tab="tabelle">Tabelle</button>
      <button role="tab" data-tab="finale">Turnierbaum</button>
      <button role="tab" data-tab="ruhm">Ruhmeshalle</button>
      <span class="spacer"></span>
      <button class="show" id="openDisplay">Anzeige für Bildschirm öffnen</button>
    </nav>
  </header>
  <main>
    <section id="teilnehmer" class="edit-only"></section>
    <section id="liga" class="edit-only"></section>
    <section id="tabelle" class="edit-only"></section>
    <section id="finale" class="edit-only"></section>
    <section id="ruhm" class="edit-only"></section>
    <section id="anzeige"></section>
  </main>
</div>
<div id="fx" role="status" aria-live="assertive"><div class="fxbox"><div class="biglights"><i></i><i></i><i></i></div><div class="fxtext" id="fxText"></div><div class="fxsub" id="fxSub"></div></div></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="wheelfx" role="status" aria-live="polite"></div>
<div class="flags" id="flags" aria-hidden="true"><div class="flag"></div><div class="flag"></div></div>

<script>
const KEY='mk-turnier-v2',RKEY='mk-ruhm-v1';
const DEF=()=>({players:[],consoles:2,rounds:3,roundsData:[],finals:null,pen:{},bountyOn:true,bountyPts:3,tb:{}});
let S=load(), ligaView=lastRound(), isDisplay=false, dIndex=0, dTimer=null;
function lastRound(){return Math.max(0,((S&&S.roundsData)||[]).length-1);}
function load(){try{const l=localStorage.getItem(KEY);if(l)return Object.assign(DEF(),JSON.parse(l));}catch(e){}return DEF();}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let seenFx=S.fx?S.fx.t:0;
window.addEventListener('storage',e=>{if(e.key===RKEY){render();return;}if(e.key!==KEY)return;S=load();
  if(S.fx&&S.fx.t>seenFx&&Date.now()-S.fx.t<20000){seenFx=S.fx.t;
    if(S.fx.type==='draw'){playStart(S.fx.round);if(isDisplay){dIndex=0;startRotation();}}
    if(S.fx.type==='win'){playWin();if(isDisplay){dIndex=0;startRotation();}}
    if(S.fx.type==='wheel'){playWheel(S.fx);if(isDisplay){dIndex=0;startRotation();}}
  }
  render();});

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const nameOf=id=>{const p=S.players.find(p=>p.id===id);return p?p.name:'?'};
const brandHtml=()=>`${S.logo?`<img src="${S.logo}" alt="Eigenes Bild">`:''}<h1 class="logo">Mario Kart Turnier</h1>`;
const badge=(n)=>`<span class="badge ${n<=3?'b'+n:''}">${n}</span>`;

/* ---------- Logik ---------- */
function groupSizes(n){if(n<=0)return[];const g=Math.ceil(n/4),b=Math.floor(n/g),x=n%g;return Array.from({length:g},(_,i)=>b+(i<x?1:0));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pairCounts(){const m={};S.roundsData.forEach(r=>r.groups.forEach(g=>{for(const a of g.members)for(const b of g.members)if(a<b){const k=a+'|'+b;m[k]=(m[k]||0)+1;}}));return m;}
function splitIntoGroups(ids,avoid){
  const sizes=groupSizes(ids.length);let best=null,bc=Infinity;
  for(let t=0;t<(avoid?400:1);t++){
    const sh=shuffle(ids),gs=[];let i=0;for(const s of sizes){gs.push(sh.slice(i,i+s));i+=s;}
    let c=0;if(avoid)for(const g of gs)for(const a of g)for(const b of g)if(a<b)c+=(avoid[a+'|'+b]||0)**2;
    if(c<bc){bc=c;best=gs;if(c===0)break;}
  }
  return (best||[]).map((m,i)=>({members:m,console:i%S.consoles+1,wave:Math.floor(i/S.consoles)+1,scores:{}}));
}
const roundComplete=r=>r.groups.every(g=>g.members.every(id=>typeof g.scores[id]==='number'));
const roundTouched=r=>r.groups.some(g=>Object.keys(g.scores).length>0);
const inAnyRound=id=>S.roundsData.some(r=>r.groups.some(g=>g.members.includes(id)));
const ligaDone=()=>S.roundsData.length>=S.rounds&&S.roundsData.slice(0,S.rounds).every(roundComplete);
/* Kopfgeld: Träger wird beim Auslosen in roundsData[i].bounty festgehalten, Bonus wird nur berechnet, nie gespeichert */
const bountyPts=()=>Math.max(0,Math.round(+S.bountyPts||0));
const bountyOf=r=>S.bountyOn!==false&&r&&r.bounty?r.bounty:null;
function bountyBonus(r,id){
  const b=bountyOf(r);if(!b||b===id)return 0;
  const g=r.groups.find(g=>g.members.includes(b));if(!g||!g.members.includes(id))return 0;
  const sb=g.scores[b],sp=g.scores[id];
  return typeof sb==='number'&&typeof sp==='number'&&sp>sb?bountyPts():0;
}
/* Stechen: S.tb["Gesamt|Bestwert"] = IDs der Stechen-Sieger in Reihenfolge. Ändert sich die Punktzahl, greift der Eintrag nicht mehr. */
const tieSig=r=>r.total+'|'+r.best;
const tbRank=r=>{const l=S.tb&&S.tb[tieSig(r)],i=Array.isArray(l)?l.indexOf(r.id):-1;return i<0?Infinity:i;};
function standings(){
  const rows=S.players.map(p=>{
    const per=S.roundsData.map(r=>{for(const g of r.groups)if(g.members.includes(p.id))return typeof g.scores[p.id]==='number'?g.scores[p.id]:null;return null;});
    const bonus=S.roundsData.map(r=>bountyBonus(r,p.id));
    const v=per.filter(x=>x!==null);
    return{id:p.id,name:p.name,per,bonus,total:v.reduce((a,b)=>a+b,0)+bonus.reduce((a,b)=>a+b,0),best:v.length?Math.max(...v):0};
  });
  rows.forEach(r=>r.tbr=tbRank(r));
  rows.sort((a,b)=>b.total-a.total||b.best-a.best||(a.tbr===b.tbr?0:a.tbr<b.tbr?-1:1)||a.name.localeCompare(b.name,'de'));
  const same=(a,b)=>!!(a&&b&&a.total===b.total&&a.best===b.best);
  rows.forEach((r,i)=>{const o=rows[i-1],n=rows[i+1];
    r.tieAny=r.total>0&&(same(o,r)||same(n,r));
    r.tie=r.tieAny&&r.tbr===Infinity&&rows.some(x=>x!==r&&same(x,r)&&x.tbr===Infinity);
    r.tieWon=r.tieAny&&r.tbr!==Infinity;});
  return rows;
}
function planFor(n){
  if(n<=4)return{type:'direct',qual:n,text:'Alle fahren direkt das Finale.'};
  if(n<=10)return{type:'top4',qual:4,text:'Die Top 4 der Tabelle fahren das Finale, alle anderen das Spaßfinale.'};
  return{type:'semis',qual:8,text:'Plätze 1–8 fahren zwei Halbfinals, die besten 2 je Halbfinale kommen ins Finale. Alle anderen fahren das Spaßfinale.'};
}
function estimate(n){
  const g=groupSizes(n).length,w=Math.ceil(g/S.consoles)||0,plan=planFor(n);
  return{g,w,total:w*13*S.rounds+(plan.type==='semis'?Math.ceil(2/S.consoles)*13:0)+(n>plan.qual?13:0)+15};
}
const heatComplete=h=>{const r=h.members.map(id=>h.place[id]).filter(Boolean);return h.members.length>0&&r.length===h.members.length&&new Set(r).size===r.length;};
const heatOrder=h=>h.members.slice().sort((a,b)=>(h.place[a]||99)-(h.place[b]||99));
function finalHeat(){
  const F=S.finals;if(!F)return null;
  let m=F.type!=='semis'?F.finalBase:(F.semis.every(heatComplete)?F.semis.flatMap(h=>heatOrder(h).slice(0,2)):[]);
  return{name:'Finale',members:m,place:F.finalPlace};
}
function startFinals(){
  const st=standings(),plan=planFor(st.length),ids=st.map(r=>r.id);
  const F={type:plan.type,semis:[],finalBase:null,finalPlace:{},fun:[]};let rest;
  if(plan.type==='semis'){const t=ids.slice(0,8);
    F.semis=[{name:'Halbfinale A',members:[t[0],t[3],t[4],t[7]].filter(Boolean),place:{}},{name:'Halbfinale B',members:[t[1],t[2],t[5],t[6]].filter(Boolean),place:{}}];
    rest=ids.slice(8);
  }else{F.finalBase=ids.slice(0,plan.qual);rest=ids.slice(plan.qual);}
  F.fun=splitIntoGroups(rest,null).map(g=>g.members);
  S.finals=F;persist();render();
}

function heatNode(h,key,editable,cls,from,placeholder){
  let body;
  if(!h||!h.members.length) body=`<p class="slot">${esc(placeholder)}</p>`;
  else if(editable){
    const opts=`<option value="">–</option>`+h.members.map((_,i)=>`<option value="${i+1}">${i+1}.</option>`).join('');
    body=h.members.map(id=>`<div class="prow"><span>${esc(nameOf(id))}</span><select data-heat="${key}" data-p="${id}" data-key="h-${key}-${id}" aria-label="Platz ${esc(nameOf(id))}">${opts}</select></div>`).join('');
  }else{
    const ord=heatComplete(h)?heatOrder(h):h.members;
    body=ord.map(id=>`<div class="trow">${heatComplete(h)?badge(h.place[id]):''}<span>${esc(nameOf(id))}</span></div>`).join('');
  }
  return`<div class="node ${cls||''}" data-node="${key}" ${from?`data-from="${from}"`:''}><div class="nh">${esc(h?h.name:'')}</div><div class="nb">${body}</div></div>`;
}
function treeHtml(editable){

  const winner=F&&fh&&heatComplete(fh)?heatOrder(fh)[0]:null;

  return html;
}
function drawWires(){
  document.querySelectorAll('.tree').forEach(tree=>{
    const svg=tree.querySelector('svg.wires');if(!svg||!tree.offsetParent)return;
    const tb=tree.getBoundingClientRect();let d='';
    let rb='';
    tree.querySelectorAll('[data-from]').forEach(node=>{
      const toFinal=node.dataset.node==='f'||node.dataset.node==='w';
      node.dataset.from.split(',').forEach(src=>{
        const s=tree.querySelector(`[data-node="${src}"]`);if(!s)return;
        const a=s.getBoundingClientRect(),b=node.getBoundingClientRect();
        const x1=a.right-tb.left,y1=a.top+a.height/2-tb.top,x2=b.left-tb.left,y2=b.top+b.height/2-tb.top,xm=(x1+x2)/2;
        const seg=`M${x1} ${y1} C${xm} ${y1},${xm} ${y2},${x2} ${y2} `;d+=seg;if(toFinal)rb+=seg;
      });
    });
    svg.setAttribute('width',tree.scrollWidth);svg.setAttribute('height',tree.scrollHeight);
    svg.innerHTML=`<path d="${d}" fill="none" stroke="var(--edge)" stroke-width="16" stroke-linecap="round"/>
      <path d="${d}" fill="none" stroke="var(--road)" stroke-width="10" stroke-linecap="round"/>
      <path d="${d}" fill="none" stroke="var(--wire-line)" stroke-width="2" stroke-dasharray="8 8"/>
      <defs><linearGradient id="rbw" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="60" y2="60" spreadMethod="repeat">
        <stop offset="0" stop-color="#ff4d4d"/><stop offset=".17" stop-color="#ffa13d"/><stop offset=".34" stop-color="#ffe14d"/><stop offset=".5" stop-color="#4ddc6b"/><stop offset=".67" stop-color="#4db8ff"/><stop offset=".84" stop-color="#9b6bff"/><stop offset="1" stop-color="#ff4d4d"/></linearGradient></defs>
      ${rb?`<path d="${rb}" fill="none" stroke="var(--edge)" stroke-width="16" stroke-linecap="round"/><path class="rb" d="${rb}" fill="none" stroke="url(#rbw)" stroke-width="10" stroke-linecap="round"/><path class="rbline" d="${rb}" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="8 8"/>`:''}`;
  });
}

function wheelSvg(cards){
  const n=cards.length,seg=360/n,R=100,cols=['var(--red)','var(--yellow)','var(--green)','var(--blue)'];
  const pt=(a,r)=>[(r*Math.sin(a*Math.PI/180)).toFixed(2),(-r*Math.cos(a*Math.PI/180)).toFixed(2)];
  let s='';
  cards.forEach((c,i)=>{
    const [x0,y0]=pt(i*seg-seg/2,R),[x1,y1]=pt(i*seg+seg/2,R);
    const col=(i===n-1&&n%4===1)?cols[2]:cols[i%4];
    s+=`<path d="M0 0L${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}Z" style="fill:${col}" stroke="#000" stroke-width="2"/>`;
    const [lx,ly]=pt(i*seg,R*.7),em=splitCard(c).em||String(i+1);
    s+=`<text x="${lx}" y="${ly}" transform="rotate(${(i*seg).toFixed(2)} ${lx} ${ly})" text-anchor="middle" dominant-baseline="central" font-size="${Math.round(Math.min(26,Math.max(13,150/n)))}" font-weight="900" fill="#1B1D29">${esc(em)}</text>`;
  });
  return`<svg viewBox="-108 -108 216 216" aria-hidden="true"><circle r="106" fill="#000"/>${s}<circle r="15" fill="#fff" stroke="#000" stroke-width="3"/></svg>`;
}

let actx=null,audioOn=false;

function tone(freq,dur,type='square',when=0,vol=.12){if(!actx||!audioOn)return;const t=actx.currentTime+when,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.05);}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

    for(const p of P){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();}

let wheelRun=0;
function playWheel(fx){
  if(!fx||!fx.spins||!fx.spins.length)return;
  const run=++wheelRun,box=$('wheelfx'),cards=fx.cards,T=reduce?.4:4.2;
  const wait=(ms,f)=>setTimeout(()=>{if(run===wheelRun)f();},ms);
  box.innerHTML=`<div class="wbox"><div class="wfor" id="wFor"></div><div class="wname" id="wName"></div>
    <div class="wheelbox"><div class="wpointer"></div><div class="wheel" id="wheel" style="transition-duration:${T}s">${wheelSvg(cards)}</div></div>
    <div class="wresult" id="wRes"></div><p class="wskip">Klicken zum Schließen</p></div>`;
  box.classList.add('on');
  box.onclick=()=>{wheelRun++;box.classList.remove('on');};
  const w=$('wheel'),n=cards.length,seg=360/n;let i=0,rot=0;
  const next=()=>{
    if(i>=fx.spins.length){
      box.querySelector('.wbox').innerHTML=`<div class="wname">Handicaps für Runde ${fx.round}</div>
        <div class="hlist wsum">${fx.spins.map(s=>{const c=splitCard(cards[s.idx]);return`<div class="hcard"><span class="em" aria-hidden="true">${esc(c.em||'🎡')}</span><div><b>${esc(s.name)}</b>${esc(c.text)}</div></div>`;}).join('')}</div>
        <p class="wskip">Klicken zum Schließen</p>`;
      wait(10000,()=>box.classList.remove('on'));return;
    }
    const s=fx.spins[i];
    $('wFor').textContent=`Glücksrad für Runde ${fx.round}, ${i+1} von ${fx.spins.length}`;
    $('wName').textContent=s.name;$('wRes').textContent='';
    const target=Math.ceil(rot/360)*360+360*(reduce?1:6)+((360-s.idx*seg)%360)+(s.j||0)*seg*.35;
    wait(800,()=>{
      w.style.transform=`rotate(${target}deg)`;
      if(!reduce){const total=target-rot;for(let k=1;k*seg<total;k++)tone(1500,.025,'square',T*(1-Math.cbrt(1-k*seg/total)),.04);}
      rot=target;
    });
    wait(800+T*1000+200,()=>{
      const c=splitCard(cards[s.idx]);$('wRes').textContent=(c.em?c.em+' ':'')+c.text;
      [659,988].forEach((f,k)=>tone(f,.28,'triangle',k*.13,.16));
      i++;wait(3400,next);
    });
  };
  next();
}
function spinWheel(){
  const wr=wheelRound();if(!wr)return;
  const cards=cardList().slice(),top=standings().slice(0,topCount()),pool=shuffle(cards.map((_,i)=>i));
  const spins=top.map((r,i)=>({id:r.id,name:r.name,idx:pool[i%pool.length],j:+(Math.random()*2-1).toFixed(3)}));
  S.pen=S.pen||{};S.pen[wr]=spins.map(s=>({id:s.id,card:cards[s.idx]}));
  S.fx={type:'wheel',round:wr,cards,spins,t:Date.now()};seenFx=S.fx.t;
  persist();render();unlockAudio();playWheel(S.fx);
}

/* ---------- Ruhmeshalle ----------
   Online-Stand: ruhmeshalle.json (relativer Pfad, statisch ausgeliefert).
   Neue Einträge landen zuerst in localStorage (RKEY) und werden per Download in die Datei übernommen.
   Der Download ist nur möglich, wenn die Online-Datei gültig geladen wurde, damit nichts verloren geht. */
const RUHM_URL='ruhmeshalle.json';
let ruhmRemote=null,ruhmRaw=null,ruhmState='loading';
const normName=n=>String(n||'').trim().replace(/\s+/g,' ').toLowerCase();
function ruhmLocal(){try{const a=JSON.parse(localStorage.getItem(RKEY));return Array.isArray(a)?a.filter(validEntry):[];}catch(e){return[];}}
function ruhmLocalSave(a){try{localStorage.setItem(RKEY,JSON.stringify(a));return true;}catch(e){alert('Speichern im Browser ist fehlgeschlagen.');return false;}}
const validEntry=t=>t&&typeof t==='object'&&Array.isArray(t.platzierung);
function loadRuhm(){
  ruhmState='loading';
  fetch(RUHM_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json();})
    .then(d=>{if(!d||typeof d!=='object'||!Array.isArray(d.turniere))throw 0;ruhmRaw=d;ruhmRemote=d.turniere;ruhmState='ok';render();})
    .catch(()=>{ruhmRaw=null;ruhmRemote=null;ruhmState='offline';render();});
}
const onlineIds=()=>new Set((ruhmRemote||[]).map(t=>t&&t.id).filter(Boolean));
function ruhmPending(){const on=onlineIds();return ruhmLocal().filter(t=>!on.has(t.id));}
function ruhmAll(){
  const on=onlineIds();
  const all=[...(ruhmRemote||[]).filter(validEntry),...ruhmLocal().filter(t=>!on.has(t.id)).map(t=>({...t,neu:true}))];
  return all.sort((a,b)=>String(b.datum||'').localeCompare(String(a.datum||'')));
}
function knownNames(){const m=new Map();ruhmAll().forEach(t=>t.platzierung.forEach(n=>{const k=normName(n);if(k&&!m.has(k))m.set(k,String(n).trim());}));return[...m.values()].sort((a,b)=>a.localeCompare(b,'de'));}
const todayIso=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const fmtDate=iso=>{const d=new Date(String(iso)+'T12:00');return isNaN(d)?String(iso||''):d.toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});};
/* Endplatzierung: Finalisten nach Finalplatz, dann alle anderen nach Liga-Tabelle (inkl. Kopfgeld-Bonus und Stechen) */
function tournamentRanking(){
  const fh=finalHeat();if(!fh||!heatComplete(fh))return null;
  const fin=heatOrder(fh),rest=standings().map(r=>r.id).filter(id=>!fin.includes(id));
  return[...fin,...rest].map(id=>nameOf(id).trim());
}
function eternal(){
  const m=new Map();
  ruhmAll().forEach(t=>t.platzierung.forEach((n,i)=>{
    const k=normName(n);if(!k)return;
    const e=m.get(k)||{name:String(n).trim(),t:0,g:0,s:0,b:0,sum:0};
    e.t++;if(i===0)e.g++;if(i===1)e.s++;if(i===2)e.b++;e.sum+=i+1;m.set(k,e);
  }));
  return[...m.values()].map(e=>({...e,pod:e.g+e.s+e.b,avg:e.sum/e.t}))
    .sort((a,b)=>b.g-a.g||b.s-a.s||b.b-a.b||a.avg-b.avg||b.t-a.t||a.name.localeCompare(b.name,'de'));
}
function ruhmHtml(editable){
  const all=ruhmAll(),pend=ruhmPending();
  let admin='';
  if(editable){
    const st=ruhmState==='loading'?`<p class="muted" style="margin-top:0">Online-Datei wird geladen …</p>`
      :ruhmState==='offline'?`<p class="rwarn">Die Datei ruhmeshalle.json konnte nicht geladen werden (z. B. weil die Seite lokal als Datei geöffnet ist oder offline). Der Download ist gesperrt, damit die bestehende Ruhmeshalle nicht mit einer unvollständigen Datei überschrieben wird.</p>`
      :`<p class="muted" style="margin-top:0">Online: ${ruhmRemote.length} ${ruhmRemote.length===1?'Turnier':'Turniere'}. ${pend.length?`${pend.length} ${pend.length===1?'Turnier steht':'Turniere stehen'} bisher nur in diesem Browser. Datei herunterladen, im Repo ruhmeshalle.json damit ersetzen und pushen.`:'Nichts Neues, alles ist online.'}</p>`;
    admin=`<div class="panel"><h3>Ruhmeshalle online aktualisieren</h3>${st}
      <div class="row"><button class="btn" id="ruhmExp" ${ruhmState==='ok'&&pend.length?'':'disabled'}>ruhmeshalle.json herunterladen</button>${ruhmState==='offline'?'<button class="btn ghost" id="ruhmReload">Erneut laden</button>':''}</div>
      <p class="note">Die Datei enthält alle Online-Einträge plus die neuen aus diesem Browser. Lokale Einträge bleiben hier gespeichert, bis sie online stehen, auch wenn das Turnier zurückgesetzt wird.</p></div>`;
  }
  if(!all.length)return`<div class="panel empty"><p>Noch keine Turniere in der Ruhmeshalle.</p>${editable?'<p class="note">Nach der Siegerehrung lässt sich das Turnier im Turnierbaum eintragen.</p>':''}</div>${admin}`;
  let et=eternal();const etAll=et.length;if(!editable)et=et.slice(0,10);
  const table=`<div class="panel"><h3>Ewige Tabelle</h3><div class="scroll"><table><thead><tr><th>Platz</th><th>Name</th><th class="num" title="Siege">🥇</th><th class="num" title="Zweite Plätze">🥈</th><th class="num" title="Dritte Plätze">🥉</th><th class="num">Podien</th><th class="num">Turniere</th><th class="num">Ø Platz</th></tr></thead>
    <tbody>${et.map((e,i)=>`<tr><td>${badge(i+1)}</td><td>${esc(e.name)}</td><td class="num">${e.g}</td><td class="num">${e.s}</td><td class="num">${e.b}</td><td class="num">${e.pod}</td><td class="num">${e.t}</td><td class="num">${e.avg.toFixed(1).replace('.',',')}</td></tr>`).join('')}</tbody></table></div>
    ${editable?'<p class="note">Sortiert nach Siegen, dann zweiten und dritten Plätzen, dann Ø-Platz. Namen werden über die Schreibweise zugeordnet (Groß-/Kleinschreibung und Leerzeichen egal).</p>':etAll>et.length?`<p class="note">Top 10 von ${etAll}</p>`:''}</div>`;
  const shown=editable?all:all.slice(0,5);
  const list=`<div class="panel"><h3>Bisherige Turniere</h3><div class="hlist">${shown.map(t=>{const p=t.platzierung;return`<div class="hcard"><span class="em" aria-hidden="true">🏆</span><div><b>${esc(t.titel||'Turnier')}</b>${esc(fmtDate(t.datum))}, ${esc(t.teilnehmer||p.length)} Teilnehmer${editable&&t.neu?`<span class="htag">noch nicht online</span><button class="tbbtn del" data-rdel="${esc(t.id)}">Eintrag löschen</button>`:''}
    <div class="rpod">🥇 ${esc(p[0]||'–')}${p[1]?`&emsp;🥈 ${esc(p[1])}`:''}${p[2]?`&emsp;🥉 ${esc(p[2])}`:''}</div></div></div>`;}).join('')}</div></div>`;
  return`<div class="rgrid"><div>${table}</div><div>${list}</div></div>${admin}`;
}
function archivedEntry(){if(!S.archivedId)return null;return ruhmAll().find(t=>t.id===S.archivedId)||null;}
function archiveHtml(){
  const rk=tournamentRanking();if(!rk)return'';
  const ex=archivedEntry();
  if(ex){
    const changed=JSON.stringify(ex.platzierung)!==JSON.stringify(rk);
    return`<div class="panel"><h3>🏛️ Ruhmeshalle</h3><p class="muted" style="margin:0">Dieses Turnier ist als „${esc(ex.titel||'Turnier')}“ eingetragen${ex.neu?', aber noch nicht online. Im Tab Ruhmeshalle die Datei herunterladen':''}.</p>
      ${changed?(ex.neu?`<p class="rwarn">Die Platzierung hat sich seit dem Eintragen geändert.</p><div class="row" style="margin-top:10px"><button class="btn" id="arUpd">Eintrag aktualisieren</button></div>`
        :`<p class="rwarn">Die Platzierung hat sich seit dem Eintragen geändert, der Eintrag ist aber schon online. Korrekturen bitte direkt in ruhmeshalle.json im Repo.</p>`):''}</div>`;
  }
  const known=new Set(knownNames().map(normName)),fresh=rk.filter(n=>!known.has(normName(n)));
  const d=new Date();
  return`<div class="panel"><h3>🏛️ In die Ruhmeshalle eintragen</h3><div class="row">
    <input type="text" id="arTitle" data-key="arTitle" value="${esc('Turnier '+d.toLocaleDateString('de-DE',{month:'long',year:'numeric'}))}" aria-label="Name des Turniers">
    <input type="date" id="arDate" value="${todayIso()}" aria-label="Datum">
    <button class="btn go" id="arBtn">Eintragen</button></div>
    <p class="note">Gespeichert wird die Endplatzierung aller ${rk.length} Teilnehmer: Finalisten nach Finalplatz, danach alle anderen nach Liga-Tabelle (mit Kopfgeld-Bonus und Stechen).</p>
    ${known.size&&fresh.length?`<p class="note">Neu in der Ruhmeshalle: <b>${fresh.map(esc).join(', ')}</b>. Falls jemand schon dabei war, aber anders geschrieben ist, vorher den Namen anpassen, sonst zählt es in der Ewigen Tabelle getrennt.</p>`:''}</div>`;
}
function archiveTournament(update){
  const rk=tournamentRanking();if(!rk)return;
  const l=ruhmLocal();
  if(update){const t=l.find(x=>x.id===S.archivedId);if(!t)return;t.platzierung=rk;t.teilnehmer=rk.length;ruhmLocalSave(l);render();return;}
  const t={id:uid()+Date.now().toString(36),datum:$('arDate').value||todayIso(),titel:$('arTitle').value.trim()||'Turnier',teilnehmer:rk.length,platzierung:rk};
  l.push(t);if(!ruhmLocalSave(l))return;S.archivedId=t.id;persist();render();
}
function renderRuhm(){
  $('ruhm').innerHTML=`<h2>Ruhmeshalle</h2>${ruhmHtml(true)}`;
  const e=$('ruhmExp');if(e)e.onclick=()=>{
    if(ruhmState!=='ok'||!ruhmRaw)return;
    const on=onlineIds();
    // Online-Einträge unverändert und in Originalreihenfolge übernehmen, neue hinten anhängen
    const data={...ruhmRaw,turniere:[...ruhmRaw.turniere,...ruhmLocal().filter(t=>!on.has(t.id))]};
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'}));a.download='ruhmeshalle.json';a.click();
  };
  const rl=$('ruhmReload');if(rl)rl.onclick=loadRuhm;
  $('ruhm').querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>{
    if(!confirm('Diesen Eintrag löschen? Er ist noch nicht online.'))return;
    ruhmLocalSave(ruhmLocal().filter(t=>t.id!==b.dataset.rdel));render();});
}
loadRuhm();

/* ---------- Tabs & Render ---------- */
const TABS=['teilnehmer','liga','tabelle','finale','ruhm'];
let tab='teilnehmer';
function showTab(t){
  if(t==='anzeige'){isDisplay=true;document.body.classList.add('display');TABS.forEach(x=>$(x).classList.remove('on'));$('anzeige').classList.add('on');startRotation();render();return;}
  if(!TABS.includes(t))t='teilnehmer';tab=t;
  document.querySelectorAll('nav [role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  TABS.forEach(x=>$(x).classList.toggle('on',x===t));
  try{if(location.hash!=='#'+t)history.replaceState(null,'','#'+t);}catch(e){}
  requestAnimationFrame(drawWires);
}
document.querySelectorAll('nav [role=tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
$('openDisplay').onclick=()=>{const w=window.open(location.href.split('#')[0]+'#anzeige','mk-anzeige');if(!w)alert('Das Fenster wurde blockiert. Öffne die Datei einfach ein zweites Mal und hänge #anzeige an die Adresse an.');};
document.addEventListener('keydown',e=>{if(isDisplay&&(e.key==='ArrowRight'||e.key===' ')){dIndex++;startRotation();render();}});

let rq=null;function queueRender(){clearTimeout(rq);rq=setTimeout(render,0);}
function render(){
  const k=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.key;
  if(isDisplay){renderDisplay();requestAnimationFrame(drawWires);return;}
  const n=S.players.length;
  $('brandEdit').innerHTML=brandHtml();
  $('sub').textContent=n?`${n} Teilnehmer, ${S.consoles} ${S.consoles===1?'Konsole':'Konsolen'}, ${S.rounds} Liga-Runden`:'Liga mit wechselnden Gruppen, danach das große Finale.';
  renderTeilnehmer();renderLiga();renderTabelle();renderFinale();renderRuhm();
  if(k){const el=document.querySelector(`[data-key="${CSS.escape(k)}"]`);if(el)el.focus();}
  requestAnimationFrame(drawWires);
}
showTab(location.hash.slice(1));
render();
</script>
